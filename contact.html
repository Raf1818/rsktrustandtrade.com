<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact &mdash; RSK Trust & Trade</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #d4af37; /* Gold accent */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 40px 30px;
            background-color: #141414;
            border-radius: 4px;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 1.8rem;
        }
        p {
            color: #e0d8c3; /* Beige text */
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 25px;
        }
        .contact-info {
            font-size: 0.95rem;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            padding-top: 20px;
            color: #b0a890;
        }
        a {
            color: #d4af37;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Page Under Maintenance</h1>
        <p>We are currently updating our communications gateway to serve you better. This section will be available shortly.</p>
        
        <div class="contact-info">
            For urgent inquiries, please contact us directly at:<br>
            <strong><a href="mailto:info@rsktrustandtrade.com">info@rsktrustandtrade.com</a></strong>
        </div>
    </div>
</body>
</html>
