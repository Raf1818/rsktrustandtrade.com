:root{--navy:#0a1931;--gold:#c9a86a;--parch:#f5f1e8;--cream:#fdfaf3}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--parch);font-family:'Inter',sans-serif;min-height:100vh;padding:30px 15px;display:flex;flex-direction:column;align-items:center}
h1{font-family:'Playfair Display',serif;font-size:26px;color:var(--navy);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:5px}
.sub{font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:600;text-transform:uppercase;text-align:center;margin-bottom:24px}
.list{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.doc{background:var(--cream);border:1.5px solid var(--gold);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;color:#111}
.doc span{font-size:11px;color:#666;font-weight:400;text-align:end}
.rsk-open{background:var(--navy);color:var(--gold);border:0;border-radius:10px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;width:100%;max-width:480px}
.back{margin-top:30px;border:1px solid var(--gold);background:var(--cream);color:#333;text-decoration:none;padding:10px 20px;border-radius:20px;font-size:12px;font-weight:600}
.rsk-modal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(10,25,49,.9);padding:15px;overflow-y:auto;justify-content:center;align-items:flex-start}
.rsk-modal.rsk-show{display:flex}
.rsk-box{position:relative;background:var(--cream);max-width:480px;width:100%;margin:20px auto;border-radius:16px;padding:24px;border:3px solid var(--gold);color:#333}
.rsk-box h2{margin:0 0 4px;color:var(--navy);font-family:'Playfair Display',serif;font-size:22px}
.rsk-sub{margin:0 0 14px;font-size:13px;color:#666}
.rsk-x{position:absolute;inset-inline-end:12px;top:8px;background:none;border:0;font-size:28px;cursor:pointer;color:var(--navy)}
.rsk-step{margin:14px 0 8px;color:var(--navy)}
.rsk-opt{display:block;border:2px solid var(--navy);border-radius:10px;padding:12px;margin-bottom:8px;font-size:14px;cursor:pointer;color:var(--navy);font-weight:600}
.rsk-opt input{margin-inline-end:8px}
.rsk-sel{width:100%;margin:2px 0 10px;padding:10px;border:1.5px solid var(--gold);border-radius:8px;font-size:14px;background:#fff}
.rsk-msg{font-size:13px;line-height:1.5;margin:10px 0}
.rsk-ok{background:#fff;border:2px solid var(--gold);border-radius:10px;padding:12px;text-align:center}
.rsk-ok a{display:block;background:var(--navy);color:var(--gold);text-decoration:none;font-weight:800;padding:12px;border-radius:8px;margin:8px 0}
.rsk-err{color:#a11;font-weight:600}
.rsk-crypto{background:var(--navy);border-radius:10px;padding:12px;margin:12px 0}
.rsk-label{font-size:11px;color:var(--gold);margin-bottom:6px}
.rsk-crypto code{display:block;background:#fff;color:#000;padding:8px;border-radius:6px;font-size:11px;word-break:break-all;text-align:center;direction:ltr}
.rsk-copy{margin-top:8px;width:100%;background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:8px;font-weight:700;cursor:pointer}
.rsk-warn{font-size:10px;color:#bbb;margin-top:6px;text-align:center}
.rsk-note{font-size:12px;line-height:1.5;margin:0 0 10px}
</style>

          if(d.download){
            result.innerHTML='';
            var box=document.createElement('div');box.className='rsk-ok';
            var a1=document.createElement('div');a1.textContent=t.ok;
            var a=document.createElement('a');a.href=d.download;a.textContent=t.dl;
            var s=document.createElement('div');s.textContent=t.save;
            box.appendChild(a1);box.appendChild(a);box.appendChild(s);
            result.appendChild(box);
          }else{showError(t.e1);}
        });
      },
      onError:function(){showError(t.e2);}
    }).render('#rskPaypal');
  }else{showError(t.e3);}
})();
</script>
</body>
</html>
